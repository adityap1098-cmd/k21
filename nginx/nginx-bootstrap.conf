# nginx/nginx-bootstrap.conf
# Used ONLY during initial certificate issuance (before certs exist).
# Replace nginx.conf with this file temporarily during ssl-bootstrap.sh.

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name _;

        # Serve ACME challenge for certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Return 200 for health checks during bootstrap
        location /health {
            return 200 'bootstrap';
            add_header Content-Type text/plain;
        }

        # Everything else returns 200 during bootstrap (not 301 — certs don't exist yet)
        location / {
            return 200 'Certificate bootstrap in progress';
            add_header Content-Type text/plain;
        }
    }
}
